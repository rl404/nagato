name: Tag

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
      - uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: ${{ steps.tag_version.outputs.previous_version }}
          replace: ${{ steps.tag_version.outputs.new_version }}
          include: "mal/mal.go"
          regex: false
      - id: push_changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "mal/mal.go"
      - uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ steps.push_changes.outputs.commit_hash }}
          custom_tag: ${{ steps.tag_version.outputs.new_version }}
